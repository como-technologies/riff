[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
authors = ["Mike Sandman <mike@thesandmans.com>"]
repository = "https://github.com/como-technologies/riff"

# One version per dependency for the whole workspace. Use the latest
# published version when you add or bump a dependency.
[workspace.dependencies]
# ── CLI ──
clap = { version = "4.6", features = ["derive", "env"] }

# ── Testing ──
assert_cmd = "2.2"

[profile.release]
strip = true
lto = true
codegen-units = 1
