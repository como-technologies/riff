[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "2.0.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
authors = ["Mike Sandman"]
repository = "https://github.com/como-technologies/riff"

# One version per dependency for the whole workspace. Use the latest
# published version when you add or bump a dependency.
[workspace.dependencies]
riff-core = { path = "crates/riff-core" }
hygiene = { path = "crates/hygiene" }

# ── Server and client ──
axum = "0.8.9"
tokio = { version = "1.53", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
futures = "0.3.34"
reqwest = { version = "0.13.5", features = ["form", "json", "query", "stream"] }
rmcp = { version = "3.4.1", features = ["server", "transport-io"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
gethostname = "1.1.0"
landlock = "0.4.7"
seccompiler = "0.5.0"
anyhow = "1.0.104"
keyring = "4.2.0"
keyring-core = "1.0.0"
base64 = "0.23.1"
getrandom = "0.4.3"
p256 = "0.14.0"
sha2 = "0.11.0"
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["aws_lc_rs"] }
open = "5.4.4"
toml_edit = "0.25.15"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# ── CLI ──
clap = { version = "4.6", features = ["derive", "env", "wrap_help"] }
anstream = "1.0.0"
anstyle = "1.0.14"
textwrap = { version = "0.16.4", features = ["terminal_size"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
rustyline = { version = "18.0.1", default-features = false }

# ── Testing ──
assert_cmd = "2.2"
tempfile = "3"
tower = { version = "0.5.3", features = ["util"] }
nix = { version = "0.31.3", features = ["term"] }
vt100 = "0.16.2"

# 01M4A4T67MPF0BCNX7AFZRDA8J: a backtrace names the file and the line of the code of
# the workspace. The dependencies have no debug info. The test profile
# inherits it.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
strip = true
lto = true
codegen-units = 1
