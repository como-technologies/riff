[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
authors = ["Mike Sandman <mike@thesandmans.com>"]
repository = "https://github.com/como-technologies/riff"

# One version per dependency for the whole workspace. Use the latest
# published version when you add or bump a dependency.
[workspace.dependencies]
riff-core = { path = "crates/riff-core" }

# ── Server and client ──
axum = "0.8.9"
tokio = { version = "1.53", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
futures = "0.3.34"
reqwest = { version = "0.13.5", features = ["json", "query", "stream"] }
rmcp = { version = "3.4.1", features = ["server", "transport-io"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
gethostname = "1.1.0"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# ── CLI ──
clap = { version = "4.6", features = ["derive", "env"] }

# ── Testing ──
assert_cmd = "2.2"
tempfile = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1
