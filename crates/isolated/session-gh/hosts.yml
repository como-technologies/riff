# each test run of just (01M6XWACAZH79NK727KMC3AQ0D). The token is not
# real, and no test may reach GitHub with it.
github.com:
    git_protocol: https
    users:
        "riff-test[bot]":
            oauth_token: riff-test-token-not-real
    oauth_token: riff-test-token-not-real
    user: "riff-test[bot]"
