[package]
name = "riff"
description = "The local client that finds sessions and wakes yours"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false
autotests = false

[dependencies]
riff-core.workspace = true
riff-state.workspace = true
riff-client.workspace = true
hygiene.workspace = true
anyhow.workspace = true
anstream.workspace = true
anstyle.workspace = true
chrono.workspace = true
rustyline.workspace = true
ratatui.workspace = true
textwrap.workspace = true
toml_edit.workspace = true
base64.workspace = true
clap.workspace = true
futures.workspace = true
getrandom.workspace = true
zeroize.workspace = true
gethostname.workspace = true
keyring-core.workspace = true
open.workspace = true
reqwest.workspace = true
rmcp.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
sha2.workspace = true
tempfile.workspace = true
tokio.workspace = true
nix = { workspace = true, features = ["fs", "signal", "user"] }

[dev-dependencies]
assert_cmd.workspace = true
riff-server = { path = "../riff-server" }
isolated = { path = "../isolated" }
axum.workspace = true
jsonwebtoken = { workspace = true, features = ["use_pem"] }
rmcp = { workspace = true, features = ["client"] }
tower.workspace = true
tokio = { workspace = true, features = ["test-util"] }
vt100.workspace = true

# 01M556QPPRSQ91HDED128G2X7G: on Linux and BSD, riff keeps its secrets
# through its own store of the Secret Service, with plain sessions. On
# each other OS, through the store of the keyring crate. The tests compare
# the store of riff with the store of the keyring crate on Linux.
[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
secret-service.workspace = true

[target.'cfg(not(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android")))))'.dependencies]
keyring.workspace = true

[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dev-dependencies]
zbus-secret-service-keyring-store.workspace = true

[[test]]
name = "all"
path = "tests/all.rs"

[[test]]
name = "back_in"
path = "tests/back_in.rs"

[[test]]
name = "join_a_riff"
path = "tests/join_a_riff.rs"

[[test]]
name = "isolation"
path = "tests/isolation.rs"

[[test]]
name = "keyring_store"
path = "tests/keyring_store.rs"
