[package]
name = "riff"
description = "The local client that finds sessions and wakes yours"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false
autotests = false

[dependencies]
riff-core.workspace = true
hygiene.workspace = true
anyhow.workspace = true
anstream.workspace = true
anstyle.workspace = true
chrono.workspace = true
rustyline.workspace = true
textwrap.workspace = true
toml_edit.workspace = true
base64.workspace = true
clap.workspace = true
futures.workspace = true
getrandom.workspace = true
gethostname.workspace = true
jsonwebtoken = { workspace = true, features = ["use_pem"] }
keyring.workspace = true
keyring-core.workspace = true
open.workspace = true
reqwest.workspace = true
rmcp.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
sha2.workspace = true
tempfile.workspace = true
tokio.workspace = true
nix = { workspace = true, features = ["fs", "signal", "user"] }

[dev-dependencies]
assert_cmd.workspace = true
riff-server = { path = "../riff-server" }
isolated = { path = "../isolated" }
axum.workspace = true
rmcp = { workspace = true, features = ["client"] }
tower.workspace = true
tokio = { workspace = true, features = ["test-util"] }
vt100.workspace = true

[[test]]
name = "all"
path = "tests/all.rs"

[[test]]
name = "back_in"
path = "tests/back_in.rs"

[[test]]
name = "join_a_riff"
path = "tests/join_a_riff.rs"

[[test]]
name = "isolation"
path = "tests/isolation.rs"
