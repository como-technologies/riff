[package]
name = "iroh-spike"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
publish = false

# Not a member of the riff workspace: the spike has its own lock file
# and its own audit.
[workspace]

[dependencies]
iroh = "1.3.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal"] }

# The release profile of riff, so that the sizes compare.
[profile.release]
strip = true
lto = true
codegen-units = 1
