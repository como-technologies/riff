name: Image of a folder
description: >-
  Builds the image of a folder and pushes it to ghcr.io with the tag
  tree-ID, when the registry has no such tag. ID is the git tree of the
  folder, so the same folder gives the same tag, also after a squash
  merge (01M4Z7SP7Y19BQ8QTV1T6AE8SR). The job checks out the repository
  first.

inputs:
  image:
    description: The name of the image, for example ghcr.io/como-technologies/riff-base.
    required: true
  folder:
    description: The folder of the Dockerfile, for example deploy/base.
    required: true
  contract:
    description: >-
      The kind for deploy/contract.sh, base or rust. With none, the
      action checks no contract (01M5SNTE280ABA4RYEPK445P3A).
    default: ""
  actor:
    description: The user that signs in to the registry.
    required: true
  token:
    description: The token that signs in to the registry, with the write of the packages.
    required: true

outputs:
  digest:
    description: The digest of the image of the folder, as sha256:HEX.
    value: ${{ steps.digest.outputs.digest }}

runs:
  using: composite
  steps:
    - name: Tag the image with the tree of its folder
      shell: bash
      env:
        FOLDER: ${{ inputs.folder }}
      run: echo "TAG=tree-$(git rev-parse "HEAD:$FOLDER")" >> "$GITHUB_ENV"

    - uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ inputs.actor }}
        password: ${{ inputs.token }}

    - uses: docker/setup-buildx-action@v4

    # A build of the same folder gives a new digest, so the job builds
    # the image of a folder only one time.
    - name: Look for the image of the folder
      id: found
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
      run: |
        if out=$(docker buildx imagetools inspect "$IMAGE:$TAG" --format '{{json .Manifest}}'); then
          echo "digest=$(jq -r .digest <<< "$out")" >> "$GITHUB_OUTPUT"
        else
          echo "The registry has no $IMAGE:$TAG. The job builds it."
        fi

    - name: Build and push the image
      id: build
      if: steps.found.outputs.digest == ''
      uses: docker/build-push-action@v7
      with:
        context: ${{ inputs.folder }}
        push: true
        tags: ${{ inputs.image }}:${{ env.TAG }}
        labels: |
          org.opencontainers.image.source=https://github.com/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}
        # One image manifest and no index: its digest is the digest
        # that a FROM line and riff.toml pin and podman pulls.
        provenance: false
        cache-from: type=gha,scope=${{ inputs.folder }}
        cache-to: type=gha,scope=${{ inputs.folder }},mode=max

    - name: Name the digest
      id: digest
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        FOLDER: ${{ inputs.folder }}
        DIGEST: ${{ steps.found.outputs.digest || steps.build.outputs.digest }}
      run: |
        echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
        {
          echo "## $IMAGE"
          echo
          echo "The image of \`$FOLDER/\` is \`$IMAGE:$TAG\`, \`$IMAGE@$DIGEST\`."
        } >> "$GITHUB_STEP_SUMMARY"

    # The check runs on the image of the registry, found or built: an
    # image that broke the contract stays out of each later run.
    - name: Check the contract of the image
      if: inputs.contract != ''
      shell: bash
      env:
        CONTRACT: ${{ inputs.contract }}
        REF: ${{ inputs.image }}@${{ steps.digest.outputs.digest }}
      run: deploy/contract.sh "$CONTRACT" "$REF"
