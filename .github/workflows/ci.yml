name: CI
# A run by hand with the input tag has the name "Deploy vX.Y.Z", so riff
# release approve and riff release check find the tag of a rollback
# (01M58KMMAPJ33CQWR8GRX62GMR). Each other run keeps its default name.
run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' && format('Deploy {0}', inputs.tag) || '' }}

on:
  # main, and each branch release/MAJOR.x of an older release line
  # (01M4YJ6KGBPTCSVMFQCDKACZPV).
  push:
    branches: [main, "release/**"]
    # A release tag: the job Release check checks its version
    # (01M3N73AW2J3TVSZWFJ88A91PG), then the job Deploy deploys it
    # (01M3NJAZ6BYH7TWKDYTVEK78PG).
    tags: ["v*"]
  pull_request:
    branches: [main, "release/**"]
  schedule:
    # Weekly advisory sweep (Mondays 06:00 UTC). New RUSTSEC advisories
    # arrive without a code change, so the audit job runs on a schedule.
    - cron: "0 6 * * 1"
  # An admin deploys a release again, or an older one for a rollback
  # (01M3NJAZ8HSE87H0GZ8SNGWN31): gh workflow run CI --ref main -f tag=v0.2.0
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag vX.Y.Z to deploy to the shared server after the gate
        type: string
        default: ""

env:
  CARGO_TERM_COLOR: always

# Least privilege: CI only reads the repo.
permissions:
  contents: read

jobs:
  # The Gate runs its checks as jobs at the same time
  # (01M513W2K3HNRWPQTQNBQPT8MZ): Clippy, the tests in parts in the
  # session image, and the other checks. Together they run each check of
  # just ci-full (01M3WNN7VQJKN5MJH7JN50VF4D). The last job, Gate, needs
  # each of them.
  # Each job runs on the runner of the repository variable RIFF_RUNNER,
  # with the default ubuntu-latest (01M513W2RERJES76ZXKKHCV0DP).
  lint:
    name: Clippy
    if: github.event_name != 'schedule' && github.ref_type != 'tag'
    runs-on: ${{ vars.RIFF_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v6

      # rust-toolchain.toml pins the toolchain; rustup reads it.
      - run: rustup show

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - run: just lint

  test:
    # Each part runs the tests whose name falls in it, so the parts
    # together run each test (01M513W2NSE303E6XAM18BW7T6). They run in a
    # container of the session image that riff.toml pins, as a session
    # runs them: --init, the user of the runner, a home of its own and the
    # limits of a session (01M515Z3Y7GSFNTJGXJD727MQK,
    # 01M51117NDKF11FNZ915TTQED4). The image has its own toolchain, so the
    # cache holds target/session.
    name: Tests ${{ matrix.part }}
    if: github.event_name != 'schedule' && github.ref_type != 'tag'
    runs-on: ${{ vars.RIFF_RUNNER || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        part: ["1/4", "2/4", "3/4", "4/4"]
    env:
      RIFF_ENGINE: docker
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v6

      - name: Cache the build
        uses: actions/cache@v4
        with:
          path: target/session
          key: session-${{ hashFiles('riff.toml', 'rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: session-

      - run: deploy/session-test.sh --part ${{ matrix.part }}

  checks:
    name: Checks
    if: github.event_name != 'schedule' && github.ref_type != 'tag'
    runs-on: ${{ vars.RIFF_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v6

      - run: rustup show

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: just,mdbook,mdbook-gruvbox,mdbook-mermaid

      - run: just fmt-check doc book reqs wrap

  gate:
    # A skipped required check counts as a pass on GitHub. So the Gate
    # runs also when a part fails or is cancelled, and fails then.
    name: Gate
    needs: [lint, test, checks]
    if: always() && github.event_name != 'schedule' && github.ref_type != 'tag'
    runs-on: ${{ vars.RIFF_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Each part passed
        env:
          RESULTS: lint=${{ needs.lint.result }} test=${{ needs.test.result }} checks=${{ needs.checks.result }}
        run: |
          echo "The parts of the Gate: $RESULTS"
          for result in $RESULTS; do
            if [ "${result#*=}" != success ]; then
              echo "::error::The part ${result%%=*} of the Gate ended with ${result#*=}."
              exit 1
            fi
          done

  static:
    # The static riff and riff-server of each pull request and each push
    # (01M4ZPJ04D9MJHNPAV0WN1KCES): a build in rust:CHANNEL-alpine, then
    # the check: no interpreter in each ELF, and riff --version runs in the
    # session image of riff.toml (01M4ZPJ06QYVA23N9SQ45T8WQC). A pull
    # request and a push build the profile dev with a cache of the build
    # and of the downloaded crates. A tag builds the profile release with
    # no cache, so each release binary comes from a clean build
    # (01M513W2V4G94R7F4D4Q3M2RA1). For a tag, it keeps the binaries for
    # the job Static riff release.
    name: Static riff
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ${{ vars.RIFF_RUNNER || 'ubuntu-latest' }}
    env:
      RIFF_ENGINE: docker
      RIFF_STATIC_CARGO: ${{ github.workspace }}/target/static-cargo
      CARGO_INCREMENTAL: 0
      PROFILE: ${{ github.ref_type == 'tag' && 'release' || 'dev' }}
    steps:
      # build-id.sh reads the last commit that changed the code.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Cache the build
        if: github.ref_type != 'tag'
        uses: actions/cache@v4
        with:
          path: |
            target/static
            target/static-cargo
          key: static-dev-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: static-dev-

      - name: Build
        run: deploy/static/build.sh "$PROFILE"

      - name: Check
        run: deploy/static/check.sh "$PROFILE"

      # The container writes as root. The cache saves the files at the
      # end of the job as the runner user.
      - name: Give the files of the build to the runner user
        if: github.ref_type != 'tag'
        run: sudo chown -R "$(id -u):$(id -g)" target/static target/static-cargo

      - name: Name the files of the release
        if: github.ref_type == 'tag'
        run: |
          mkdir dist
          for name in riff riff-server; do
            cp "target/static/release/$name" "dist/$name-x86_64-unknown-linux-musl"
          done
          cd dist
          sha256sum -- riff-x86_64-unknown-linux-musl riff-server-x86_64-unknown-linux-musl > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@v4
        if: github.ref_type == 'tag'
        with:
          name: static-riff
          path: dist/
          if-no-files-found: error

  static_release:
    # For a release tag, the static binaries and SHA256SUMS go to the
    # GitHub release of the tag (01M4ZPJ091W3NYV1V0FJS9K6MS). The admin
    # publishes the release after the push of the tag, so the job waits up
    # to 60 minutes for it. Only this job writes the repository.
    name: Static riff release
    needs: [static]
    if: github.ref_type == 'tag'
    runs-on: ${{ vars.RIFF_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: static-riff
          path: dist

      - name: Wait for the release
        run: |
          for _ in $(seq 120); do
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null; then
              exit 0
            fi
            echo "The release $TAG is not there yet. Publish it: gh release create $TAG"
            sleep 30
          done
          echo "::error::The release $TAG is not there after 60 minutes. Publish it, then run this job again."
          exit 1

      - name: Add the files to the release
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"

  release:
    # A pushed tag v* fails when its version is not the version of the
    # crates (01M3N73AW2J3TVSZWFJ88A91PG).
    name: Release check
    if: github.ref_type == 'tag'
    runs-on: ${{ vars.RIFF_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v6

      - name: Check the release tag
        run: deploy/release-check.sh "$GITHUB_REF_NAME"

  deploy:
    # A push of a release tag, after its Release check, or a run of this
    # workflow by hand on main with the input tag, after the gate, builds
    # the image of that release and deploys it to Cloud Run, when the
    # repository variable CLOUD_DEPLOY is true (01M3NJAZ6BYH7TWKDYTVEK78PG).
    # It deploys only a release tag vX.Y.Z (01M3MRMAY3P1K151RGAP9K6GSH).
    # A push to main never deploys here (01M3NJAZ8HSE87H0GZ8SNGWN31). On a
    # tag push the gate is skipped, and on a run by hand the Release
    # check is, so the if: names the result of each need and does not
    # skip on a skipped need. The job signs in to Google Cloud with the
    # OIDC token of GitHub; no key exists (01M3NJAZAQ3AKMAM0EGM7R3S89).
    # One deploy runs at a time; a newer run waits for it. The job runs
    # in the GitHub environment production, so it waits for the approval
    # of its reviewer (01M496K1KN392S11YEH33JGK9N). A tag deploys only
    # after its static binaries are on its release, so a machine that sees
    # the new server can download them (01M4ZPJ091W3NYV1V0FJS9K6MS).
    name: Deploy
    needs: [gate, release, static_release]
    if: >-
      !cancelled() && vars.CLOUD_DEPLOY == 'true' && (
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.release.result == 'success' && needs.static_release.result == 'success') ||
      (github.event_name == 'workflow_dispatch' && inputs.tag != '' && github.ref == 'refs/heads/main' && needs.gate.result == 'success'))
    runs-on: ${{ vars.RIFF_RUNNER || 'ubuntu-latest' }}
    environment: production
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0

      - name: Check the release tag
        run: deploy/release-check.sh "$TAG"

      - name: Read the cloud settings
        run: |
          grep -E '^[A-Z_]+=' deploy/cloud/shared.env >> "$GITHUB_ENV"
          . deploy/cloud/shared.env
          echo "IMAGE=$CLOUD_REGION-docker.pkg.dev/$CLOUD_PROJECT/$CLOUD_REPOSITORY/riff-server:$TAG" >> "$GITHUB_ENV"
          deploy/build-id.sh >> "$GITHUB_ENV"

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/${{ env.CLOUD_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github/providers/github
          service_account: ${{ env.CLOUD_DEPLOY_ACCOUNT }}@${{ env.CLOUD_PROJECT }}.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v3

      - name: Let Docker push to the image repository
        run: gcloud auth configure-docker "$CLOUD_REGION-docker.pkg.dev" --quiet

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}
          build-args: |
            RIFF_COMMIT=${{ env.RIFF_COMMIT }}
            RIFF_COMMIT_TIME=${{ env.RIFF_COMMIT_TIME }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The deploy is the riff cloud deploy of a person
      # (01M4262E0QJHCZXNH7EFG7FXN2), of the riff of the tag.
      - run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Deploy
        env:
          RIFF_OWNER: ${{ vars.RIFF_OWNER }}
        run: cargo run --locked -q -p riff -- cloud deploy shared "$TAG" --confirm shared

  stage:
    # Each push to main, after its gate, builds the image of the commit
    # and deploys it to the stage, when the repository variable
    # STAGE_DEPLOY is true (01M496JT94NQ686GVSY5CCGZK7). The job runs in
    # the GitHub environment stage, which needs no approval. The image
    # tag is the full ID of the commit (01M496JTDB16G52G22CJZRA8J0). Then
    # the smoke test signs in as the test account, with the secret
    # RIFF_SMOKE_TOKEN of the environment stage, and checks the stage
    # (01M496JTHN19BZ7YN94993R35X). It never deploys the shared riff
    # (01M3NJAZ8HSE87H0GZ8SNGWN31). One stage deploy runs at a time; a
    # newer run waits for it.
    name: Stage
    needs: [gate]
    if: >-
      vars.STAGE_DEPLOY == 'true' && github.event_name == 'push' &&
      github.ref == 'refs/heads/main' && needs.gate.result == 'success'
    runs-on: ${{ vars.RIFF_RUNNER || 'ubuntu-latest' }}
    environment: stage
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: stage
      cancel-in-progress: false
    env:
      COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Read the cloud settings
        run: |
          grep -E '^[A-Z_]+=' deploy/cloud/stage.env >> "$GITHUB_ENV"
          . deploy/cloud/stage.env
          echo "IMAGE=$CLOUD_REGION-docker.pkg.dev/$CLOUD_PROJECT/$CLOUD_REPOSITORY/riff-server:$COMMIT" >> "$GITHUB_ENV"
          deploy/build-id.sh >> "$GITHUB_ENV"

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/${{ env.CLOUD_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github/providers/github
          service_account: ${{ env.CLOUD_DEPLOY_ACCOUNT }}@${{ env.CLOUD_PROJECT }}.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v3

      - name: Let Docker push to the image repository
        run: gcloud auth configure-docker "$CLOUD_REGION-docker.pkg.dev" --quiet

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}
          build-args: |
            RIFF_COMMIT=${{ env.RIFF_COMMIT }}
            RIFF_COMMIT_TIME=${{ env.RIFF_COMMIT_TIME }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Deploy
        env:
          RIFF_OWNER: ${{ vars.RIFF_OWNER }}
        run: cargo run --locked -q -p riff -- cloud deploy stage "$COMMIT"

      - name: Smoke test
        env:
          RIFF_SMOKE_TOKEN: ${{ secrets.RIFF_SMOKE_TOKEN }}
          RIFF_HOME: ${{ runner.temp }}/riff-home
        run: cargo run --locked -q -p riff -- cloud smoke stage

  audit:
    # A separate job, so a new advisory cannot hide a code failure (and the
    # reverse). The weekly schedule runs only this job.
    name: Crate audit
    runs-on: ${{ vars.RIFF_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v6

      - run: rustup show

      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-audit

      - name: Audit
        run: just crate-audit
