name: CI
# A run by hand with the input tag has the name "Deploy vX.Y.Z", so riff
# release approve and riff release check find the tag of a rollback
# (01M58KMMAPJ33CQWR8GRX62GMR). Each other run keeps its default name.
run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' && format('Deploy {0}', inputs.tag) || '' }}

on:
  # main (01M5RG6BZQC8T6SZ8NX9W8TT5M).
  push:
    branches: [main]
    # A release tag: the job Release check checks its version
    # (01M3N73AW2J3TVSZWFJ88A91PG), then the job Deploy deploys it
    # (01M3NJAZ6BYH7TWKDYTVEK78PG).
    tags: ["v*"]
  pull_request:
    branches: [main]
  # The merge queue of main (01M5TKPHDNHY75BHPD4XVBJRN9): GitHub builds a
  # merge group commit of main and the pull request, and the required
  # checks run on it again, also the Gate (01M5TKPHH2627K9NDS4P1Y1N3T).
  merge_group:
  schedule:
    # Weekly advisory sweep (Mondays 06:00 UTC). New RUSTSEC advisories
    # arrive without a code change, so the audit job runs on a schedule.
    - cron: "0 6 * * 1"
  # An admin deploys a release again, or an older one for a rollback
  # (01M3NJAZ8HSE87H0GZ8SNGWN31): gh workflow run CI --ref main -f tag=v0.2.0
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag vX.Y.Z to deploy to the shared server after the gate
        type: string
        default: ""

env:
  CARGO_TERM_COLOR: always

# Least privilege: CI only reads the repo, and the artifacts of its
# runs. A job takes an artifact of another run with actions: read.
permissions:
  contents: read
  actions: read

jobs:
  # For Linux, CI compiles the code of a tree only in the job Build: the
  # test build and the static build (01M6QQ1NXY0CXMZEEEP413W4PK). Each
  # other job but macOS and the jobs of the build of a Mac takes the
  # binaries of Build from its artifacts. The artifacts have the git tree
  # of the commit in their name, so a push to main, a merge group and a
  # tag take the binaries that the pull request with the same tree made
  # (01M6QQ1P0GH9AGCDA5N8EMEFGF, 01M6QQ1P37XW7N465MQGPHCXZM). The Gate
  # keeps its pass as the artifact gate-TREE, so a merge group or a push
  # to main with a tree that passed tests it no more
  # (01M75NAF4JQWQG3ZVGJM74XRBG, 01M75NAF7VV5S7343P9Q7H7F60,
  # 01M75NAFBH6M49GMSV8VG857EP). A pull request and a merge group build
  # the profile dev. The first push of a tree to main builds its release
  # binaries, of Linux and of a Mac, once, and a tag takes them
  # (01M75TMWKT8E0YYEENWVX4B67A, 01M75TN3EC2T25FH0D09JESHZF).
  #
  # The Gate runs its checks as jobs (01M513W2K3HNRWPQTQNBQPT8MZ): Plan,
  # Build, and the tests in parts. Together they run each check of just
  # ci-full (01M3WNN7VQJKN5MJH7JN50VF4D). The job macOS runs the lint and
  # the tests of riff, riff-client and riff-core on a Mac
  # (01M6YPB5DZ9M3VEJ7V7P7EF797). The last job, Gate, needs each of them.
  # Each job but macOS, macOS riff and Linux riff of a Mac runs on the
  # runner of the repository variable RIFF_RUNNER, with the default
  # ubuntu-latest (01M513W2RERJES76ZXKKHCV0DP).
  plan:
    # The plan of the run, before each other job
    # (01M75NAF4JQWQG3ZVGJM74XRBG): the artifacts of the tree that a run
    # made already, the ones that Build and the jobs of a Mac make, and if
    # the tests and macOS run. It compiles nothing. A push, to main or of
    # a tag, wants the profile release: the release binaries of Linux and
    # of a Mac (01M75TMWKT8E0YYEENWVX4B67A). Each other event wants the
    # profile dev. A tag needs no test.
    name: Plan
    if: github.event_name != 'schedule'
    runs-on: ${{ vars.RIFF_RUNNER || 'ubuntu-latest' }}
    outputs:
      tree: ${{ steps.plan.outputs.tree }}
      run_tests: ${{ steps.plan.outputs.run_tests }}
      passed_run: ${{ steps.plan.outputs.passed_run }}
      build_tests: ${{ steps.plan.outputs.build_tests }}
      tests_run: ${{ steps.plan.outputs.tests_run }}
      build_static: ${{ steps.plan.outputs.build_static }}
      static_profile: ${{ steps.plan.outputs.static_profile }}
      static_run: ${{ steps.plan.outputs.static_run }}
      build_macos_riff: ${{ steps.plan.outputs.build_macos_riff }}
      macos_riff_run: ${{ steps.plan.outputs.macos_riff_run }}
      build_mac_session_riff: ${{ steps.plan.outputs.build_mac_session_riff }}
      mac_session_riff_run: ${{ steps.plan.outputs.mac_session_riff_run }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PROFILE: ${{ github.event_name == 'push' && 'release' || 'dev' }}
      TESTS: ${{ github.ref_type != 'tag' }}
    steps:
      - uses: actions/checkout@v7

      - name: Plan the run
        id: plan
        run: deploy/build-plan.sh

  build:
    # A step builds only what the plan finds missing: the checks and the
    # test build run in the session image, as the tests run
    # (01M515Z3Y7GSFNTJGXJD727MQK), and the static build runs in
    # rust:CHANNEL-alpine (01M4ZPJ04D9MJHNPAV0WN1KCES). The profile
    # release of a push builds with no cache, so each release binary
    # comes from a clean build (01M6QQ1P8H32E2TQ0CYA87R02V,
    # 01M75TMWKT8E0YYEENWVX4B67A). The job keeps each artifact only after
    # each step passed.
    name: Build
    needs: [plan]
    if: github.event_name != 'schedule'
    runs-on: ${{ vars.RIFF_RUNNER || 'ubuntu-latest' }}
    env:
      RIFF_ENGINE: docker
      RIFF_STATIC_CARGO: ${{ github.workspace }}/target/static-cargo
      CARGO_INCREMENTAL: 0
    steps:
      # build-id.sh reads the time of the last commit that changed the code.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # session-test.sh names the path of the build, so it is in the key
      # (01M75NDR415ES5GK69MX80PTBS).
      - name: Cache the test build
        if: needs.plan.outputs.build_tests == 'true'
        uses: actions/cache@v6
        with:
          path: target/session
          key: session-${{ hashFiles('riff.toml', 'rust-toolchain.toml', 'Cargo.lock', 'deploy/session-test.sh') }}
          restore-keys: session-

      - name: Check the code and build the tests
        if: needs.plan.outputs.build_tests == 'true'
        run: deploy/session-test.sh --build

      - name: Cache the static build
        if: needs.plan.outputs.build_static == 'true' && needs.plan.outputs.static_profile != 'release'
        uses: actions/cache@v6
        with:
          path: |
            target/static
            target/static-cargo
          key: static-dev-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: static-dev-

      - name: Build the static riff
        if: needs.plan.outputs.build_static == 'true'
        env:
          STATIC_PROFILE: ${{ needs.plan.outputs.static_profile }}
        run: deploy/static/build.sh "$STATIC_PROFILE"

      # The container writes as root. The cache saves the files at the
      # end of the job as the runner user.
      - name: Give the files of the build to the runner user
        if: needs.plan.outputs.build_static == 'true' && needs.plan.outputs.static_profile != 'release'
        run: sudo chown -R "$(id -u):$(id -g)" target/static target/static-cargo

      - uses: actions/upload-artifact@v7
        if: needs.plan.outputs.build_tests == 'true'
        with:
          name: tests-${{ needs.plan.outputs.tree }}
          path: target/test-archive/
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: needs.plan.outputs.build_static == 'true'
        with:
          name: static-${{ needs.plan.outputs.static_profile }}-${{ needs.plan.outputs.tree }}
          path: |
            target/static/${{ needs.plan.outputs.static_profile == 'release' && 'release' || 'debug' }}/riff
            target/static/${{ needs.plan.outputs.static_profile == 'release' && 'release' || 'debug' }}/riff-server
          if-no-files-found: error

  test:
    # Each part runs the tests whose name falls in it, so the parts
    # together run each test (01M513W2NSE303E6XAM18BW7T6). A part takes
    # the test binaries of Build, and compiles nothing
    # (01M6QQ1P5YCT0JX90X5FCKM4W1). It runs in a container of the session
    # image that riff.toml pins, as a session runs the tests: --init, the
    # user of the runner, a home of its own and the limits of a session
    # (01M515Z3Y7GSFNTJGXJD727MQK, 01M51117NDKF11FNZ915TTQED4). A tree
    # that passed its Gate runs no part again (01M75NAF4JQWQG3ZVGJM74XRBG).
    name: Tests ${{ matrix.part }}
    needs: [plan, build]
    if: github.event_name != 'schedule' && github.ref_type != 'tag' && needs.plan.outputs.run_tests == 'true'
    runs-on: ${{ vars.RIFF_RUNNER || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        part: ["1/4", "2/4", "3/4", "4/4"]
    env:
      RIFF_ENGINE: docker
    steps:
      # The same history as Build: a test that reads the git history of
      # the checkout finds what the build found.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: tests-${{ needs.plan.outputs.tree }}
          run-id: ${{ needs.plan.outputs.tests_run }}
          github-token: ${{ github.token }}
          path: target/test-archive

      - run: deploy/session-test.sh --archive ${{ matrix.part }}

  macos:
    # The lint and the tests of riff, riff-client and riff-core on macOS,
    # on a macOS runner of GitHub with Apple silicon
    # (01M6YPB5DZ9M3VEJ7V7P7EF797). It compiles them for macOS, with no
    # session image and no artifact of Build. It has the condition of
    # Tests I/N, and the Gate needs it. It needs only the plan, so it
    # starts beside Build (01M75NAF4JQWQG3ZVGJM74XRBG).
    name: macOS
    needs: [plan]
    if: github.event_name != 'schedule' && github.ref_type != 'tag' && needs.plan.outputs.run_tests == 'true'
    runs-on: macos-latest
    # A test that hangs on macOS stops the job, not the Gate for hours.
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: 0
    steps:
      # The same history as Build: a test that reads the git history of
      # the checkout finds what the build found.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check that the runner is a Mac with Apple silicon
        run: test "$(uname -sm)" = "Darwin arm64"

      # rust-toolchain.toml pins the toolchain; rustup reads it.
      - run: rustup show

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - run: just test-macos

  gate:
    # A skipped required check counts as a pass on GitHub. So the Gate
    # runs also when a part fails or is cancelled, and fails then. When
    # the plan found the pass of a run on the tree, PASSED_RUN, the tests
    # and macOS were skipped, and the Gate passes on that pass. Else the
    # Gate keeps its pass as gate-TREE (01M75NAF4JQWQG3ZVGJM74XRBG).
    name: Gate
    needs: [plan, build, test, macos]
    if: always() && github.event_name != 'schedule' && github.ref_type != 'tag'
    runs-on: ${{ vars.RIFF_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Each part passed
        env:
          RESULTS: plan=${{ needs.plan.result }} build=${{ needs.build.result }} test=${{ needs.test.result }} macos=${{ needs.macos.result }}
          PASSED_RUN: ${{ needs.plan.outputs.passed_run }}
        run: |
          echo "The parts of the Gate: $RESULTS"
          for result in $RESULTS; do
            part=${result%%=*}
            ended=${result#*=}
            case "$part=$ended" in
              test=skipped | macos=skipped)
                if [ -n "$PASSED_RUN" ]; then
                  continue
                fi
                ;;
            esac
            if [ "$ended" != success ]; then
              echo "::error::The part $part of the Gate ended with $ended."
              exit 1
            fi
          done
          if [ -n "$PASSED_RUN" ]; then
            echo "Run $PASSED_RUN passed the Gate on this tree, so the tests and macOS did not run again."
          fi

      - name: Write the pass of the tree
        if: needs.plan.outputs.run_tests == 'true'
        env:
          TREE: ${{ needs.plan.outputs.tree }}
        run: |
          mkdir -p target/gate
          echo "Run $GITHUB_RUN_ID passed the Gate on the tree $TREE at the commit $GITHUB_SHA." > target/gate/passed

      - uses: actions/upload-artifact@v7
        if: needs.plan.outputs.run_tests == 'true'
        with:
          name: gate-${{ needs.plan.outputs.tree }}
          path: target/gate/
          if-no-files-found: error

  merge_verify:
    # The verify is a status of the head commit of a pull request, so the
    # merge group commit has none, and the queue would wait for it
    # (01M5TKPHH2627K9NDS4P1Y1N3T). This job sets riff/verify on the merge
    # group commit from the status of the head of the pull request, and
    # starts no verify. A pull request without a passed verify gets
    # failure, and the queue removes it.
    name: Verify of the merge group
    if: github.event_name == 'merge_group'
    runs-on: ${{ vars.RIFF_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      HEAD_REF: ${{ github.event.merge_group.head_ref }}
      HEAD_SHA: ${{ github.event.merge_group.head_sha }}
    steps:
      - uses: actions/checkout@v7

      - run: deploy/merge-group-verify.sh "$HEAD_REF" "$HEAD_SHA"

  static:
    # The check of the static riff and riff-server of each pull request
    # and each push (01M4ZPJ06QYVA23N9SQ45T8WQC). The job Build made them,
    # or took them from the run that made them for the same tree: no ELF
    # has an interpreter, and riff --version runs in the session image of
    # riff.toml. Then the release test runs them: a smoke test, and no
    # test binary (01M75TN3HCK6VBB2GRCJG1Y5B2). For a push, the job sets
    # the status riff/release-test of the commit from the release
    # binaries (01M75TN3M9JEVZQXEA2E8FTBKS). A tag takes the profile
    # release of its tree, and keeps the binaries for the job Static riff
    # release.
    name: Static riff
    needs: [plan, build]
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ${{ vars.RIFF_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
      actions: read
      statuses: write
    env:
      RIFF_ENGINE: docker
      PROFILE: ${{ needs.plan.outputs.static_profile }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: static-${{ needs.plan.outputs.static_profile }}-${{ needs.plan.outputs.tree }}
          run-id: ${{ needs.plan.outputs.static_run }}
          github-token: ${{ github.token }}
          path: target/static/${{ needs.plan.outputs.static_profile == 'release' && 'release' || 'debug' }}

      # An artifact has no file mode.
      - name: Make the files run
        run: chmod +x target/static/*/riff target/static/*/riff-server

      - name: Check
        run: deploy/static/check.sh "$PROFILE"

      - name: Smoke test
        id: smoke
        run: deploy/static/smoke.sh "$PROFILE"

      # A failed check skips the smoke test: then the status is failure.
      - name: Set the status of the release test
        if: ${{ !cancelled() && github.event_name == 'push' && needs.plan.outputs.static_profile == 'release' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OUTCOME: ${{ steps.smoke.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: deploy/release-test-status.sh "$OUTCOME" "$GITHUB_SHA" "$RUN_URL"

      - name: Name the files of the release
        if: github.ref_type == 'tag'
        run: |
          mkdir dist
          for name in riff riff-server; do
            cp "target/static/release/$name" "dist/$name-x86_64-unknown-linux-musl"
          done
          cd dist
          sha256sum -- riff-x86_64-unknown-linux-musl riff-server-x86_64-unknown-linux-musl > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@v7
        if: github.ref_type == 'tag'
        with:
          name: static-riff
          path: dist/
          if-no-files-found: error

  static_release:
    # For a release tag, the static binaries and SHA256SUMS go to the
    # GitHub release of the tag (01M4ZPJ091W3NYV1V0FJS9K6MS). The admin
    # publishes the release after the push of the tag, so the job waits up
    # to 60 minutes for it. Only this job and macOS riff release write the
    # repository.
    name: Static riff release
    needs: [static]
    if: github.ref_type == 'tag'
    runs-on: ${{ vars.RIFF_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: static-riff
          path: dist

      - name: Wait for the release
        run: |
          for _ in $(seq 120); do
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null; then
              exit 0
            fi
            echo "The release $TAG is not there yet. Publish it: gh release create $TAG"
            sleep 30
          done
          echo "::error::The release $TAG is not there after 60 minutes. Publish it, then run this job again."
          exit 1

      - name: Add the files to the release
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"

  macos_riff:
    # The riff and riff-server of a tree for a Mac with Apple silicon,
    # aarch64-apple-darwin (01M6Z8F7B3HVVNGQMX8GP1Z7Q1): a build of the
    # profile release with no cache, on a macOS runner of GitHub
    # (01M6Z8FKZRJZ4NY60PQAH9SMHV). It runs when the plan finds no
    # macos-riff-TREE, so the first push of the tree builds it, and a
    # tag takes it (01M75TMWKT8E0YYEENWVX4B67A). The jobs of the Mac have
    # continue-on-error, and no job of Linux needs them. So a failed build
    # for the Mac stops neither the files, nor the run, nor the deploy of
    # Linux.
    name: macOS riff
    needs: [plan]
    if: needs.plan.outputs.build_macos_riff == 'true'
    runs-on: macos-latest
    continue-on-error: true
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: 0
    steps:
      # The build reads the time of the last commit that changed the code.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check that the runner is a Mac with Apple silicon
        run: test "$(uname -sm)" = "Darwin arm64"

      # rust-toolchain.toml pins the toolchain; rustup reads it.
      - run: rustup show

      - name: Build the riff of a Mac
        run: cargo build --locked --profile release -p riff -p riff-server

      - name: Check the riff of a Mac
        run: |
          target/release/riff --version
          target/release/riff-server --version

      - name: Name the files of the release
        run: |
          mkdir dist
          for name in riff riff-server; do
            cp "target/release/$name" "dist/$name-aarch64-apple-darwin"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: macos-riff-${{ needs.plan.outputs.tree }}
          path: dist/
          if-no-files-found: error

  mac_session_riff:
    # The Linux riff that the daemon on a Mac binds into each session
    # (01M6Z8FM5F0Y7BQYNF8XS1B0T2): the static riff of a tree for
    # aarch64-unknown-linux-musl, the Linux of a VM on Apple silicon.
    # deploy/static/build.sh builds for the CPU of the runner, so the job
    # runs on an arm64 runner of GitHub (01M6Z8FKZRJZ4NY60PQAH9SMHV). It
    # runs when the plan finds no mac-session-riff-TREE, as macOS riff
    # does (01M75TMWKT8E0YYEENWVX4B67A). The session image is for amd64
    # only, so riff --version runs on the runner.
    name: Linux riff of a Mac
    needs: [plan]
    if: needs.plan.outputs.build_mac_session_riff == 'true'
    runs-on: ubuntu-24.04-arm
    continue-on-error: true
    timeout-minutes: 60
    env:
      RIFF_ENGINE: docker
      CARGO_INCREMENTAL: 0
    steps:
      # build-id.sh reads the time of the last commit that changed the code.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check that the runner is Linux on arm64
        run: test "$(uname -sm)" = "Linux aarch64"

      - name: Build the static riff
        run: deploy/static/build.sh release

      - name: Check the static riff
        run: |
          file=target/static/release/riff
          if readelf -lW "$file" | grep -q 'Requesting program interpreter'; then
            echo "::error::$file needs shared libraries: it is not static."
            exit 1
          fi
          "$file" --version

      - name: Name the file of the release
        run: |
          mkdir dist
          cp target/static/release/riff dist/riff-aarch64-unknown-linux-musl

      - uses: actions/upload-artifact@v7
        with:
          name: mac-session-riff-${{ needs.plan.outputs.tree }}
          path: dist/
          if-no-files-found: error

  macos_release:
    # For a release tag, the files of a Mac go to the GitHub release of
    # the tag, with SHA256SUMS-aarch64-apple-darwin
    # (01M6Z8F7B3HVVNGQMX8GP1Z7Q1, 01M6Z8FKZRJZ4NY60PQAH9SMHV). The job
    # takes them from the runs that the plan names: often the run of the
    # push to main of the commit, and then the tag builds nothing
    # (01M75TN3EC2T25FH0D09JESHZF). A job of a Mac that the plan skipped
    # does not skip this job. It waits up to 60 minutes for the release,
    # as Static riff release does. The sums go last, so a Mac finds them
    # only when each file is there.
    name: macOS riff release
    needs: [plan, macos_riff, mac_session_riff]
    if: ${{ !cancelled() && needs.plan.result == 'success' && github.ref_type == 'tag' }}
    runs-on: ${{ vars.RIFF_RUNNER || 'ubuntu-latest' }}
    continue-on-error: true
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: macos-riff-${{ needs.plan.outputs.tree }}
          run-id: ${{ needs.plan.outputs.macos_riff_run }}
          github-token: ${{ github.token }}
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: mac-session-riff-${{ needs.plan.outputs.tree }}
          run-id: ${{ needs.plan.outputs.mac_session_riff_run }}
          github-token: ${{ github.token }}
          path: dist

      - name: Write the sums of a Mac
        run: |
          cd dist
          sha256sum -- riff-aarch64-apple-darwin riff-aarch64-unknown-linux-musl riff-server-aarch64-apple-darwin > SHA256SUMS-aarch64-apple-darwin
          cat SHA256SUMS-aarch64-apple-darwin

      - name: Wait for the release
        run: |
          for _ in $(seq 120); do
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null; then
              exit 0
            fi
            echo "The release $TAG is not there yet. Publish it: gh release create $TAG"
            sleep 30
          done
          echo "::error::The release $TAG is not there after 60 minutes. Publish it, then run this job again."
          exit 1

      - name: Add the files of a Mac to the release
        run: |
          gh release upload "$TAG" dist/riff-* --clobber --repo "$GITHUB_REPOSITORY"
          gh release upload "$TAG" dist/SHA256SUMS-aarch64-apple-darwin --clobber --repo "$GITHUB_REPOSITORY"

  release:
    # A pushed tag v* fails when its version is not the version of the
    # crates (01M3N73AW2J3TVSZWFJ88A91PG).
    name: Release check
    if: github.ref_type == 'tag'
    runs-on: ${{ vars.RIFF_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7

      - name: Check the release tag
        run: deploy/release-check.sh "$GITHUB_REF_NAME"


  deploy:
    # A push of a release tag, after its Release check, or a run of this
    # workflow by hand on main with the input tag, after the gate, builds
    # the image of that release and deploys it to Cloud Run, when the
    # repository variable CLOUD_DEPLOY is true (01M3NJAZ6BYH7TWKDYTVEK78PG).
    # It deploys only a release tag vX.Y.Z (01M3MRMAY3P1K151RGAP9K6GSH).
    # A push to main never deploys here (01M3NJAZ8HSE87H0GZ8SNGWN31). On a
    # tag push the gate is skipped, and on a run by hand the Release
    # check is, so the if: names the result of each need and does not
    # skip on a skipped need. The job signs in to Google Cloud with the
    # OIDC token of GitHub; no key exists (01M3NJAZAQ3AKMAM0EGM7R3S89).
    # One deploy runs at a time; a newer run waits for it. The job runs
    # in the GitHub environment production, so it waits for the approval
    # of its reviewer (01M496K1KN392S11YEH33JGK9N). A tag deploys only
    # after its static binaries are on its release, so a machine that sees
    # the new server can download them (01M4ZPJ091W3NYV1V0FJS9K6MS). The
    # job compiles nothing (01M6QQ1PB372MQ7M527HVT323F): the image holds
    # the riff-server of the release, and the deploy is the riff of the
    # release.
    name: Deploy
    needs: [gate, release, static_release]
    if: >-
      !cancelled() && vars.CLOUD_DEPLOY == 'true' && (
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.release.result == 'success' && needs.static_release.result == 'success') ||
      (github.event_name == 'workflow_dispatch' && inputs.tag != '' && github.ref == 'refs/heads/main' && needs.gate.result == 'success'))
    runs-on: ${{ vars.RIFF_RUNNER || 'ubuntu-latest' }}
    environment: production
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0

      - name: Check the release tag
        run: deploy/release-check.sh "$TAG"

      - name: Read the cloud settings
        run: |
          grep -E '^[A-Z_]+=' deploy/cloud/shared.env >> "$GITHUB_ENV"
          . deploy/cloud/shared.env
          echo "IMAGE=$CLOUD_REGION-docker.pkg.dev/$CLOUD_PROJECT/$CLOUD_REPOSITORY/riff-server:$TAG" >> "$GITHUB_ENV"

      # The files of the release: the job Static riff release put them
      # there, and the SHA-256 of each file is in SHA256SUMS.
      - name: Take the files of the release
        run: |
          mkdir dist
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist \
            --pattern '*-x86_64-unknown-linux-musl' --pattern SHA256SUMS
          (cd dist && sha256sum --check SHA256SUMS)
          chmod +x dist/*-x86_64-unknown-linux-musl

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/${{ env.CLOUD_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github/providers/github
          service_account: ${{ env.CLOUD_DEPLOY_ACCOUNT }}@${{ env.CLOUD_PROJECT }}.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v3

      - name: Let Docker push to the image repository
        run: gcloud auth configure-docker "$CLOUD_REGION-docker.pkg.dev" --quiet

      - name: Build and push the image of the release
        run: deploy/cloud/image.sh "$IMAGE" dist/riff-server-x86_64-unknown-linux-musl

      # The deploy is the riff cloud deploy of a person
      # (01M4262E0QJHCZXNH7EFG7FXN2), of the riff of the tag.
      - name: Deploy
        env:
          RIFF_OWNER: ${{ vars.RIFF_OWNER }}
        run: dist/riff-x86_64-unknown-linux-musl cloud deploy shared "$TAG" --confirm shared

  stage:
    # Each push to main, after its gate, builds the image of the commit
    # and deploys it to the stage, when the repository variable
    # STAGE_DEPLOY is true (01M496JT94NQ686GVSY5CCGZK7). The job runs in
    # the GitHub environment stage, which needs no approval. The image
    # tag is the full ID of the commit (01M496JTDB16G52G22CJZRA8J0). Then
    # the smoke test signs in as the test account, with the secret
    # RIFF_SMOKE_TOKEN of the environment stage, and checks the stage
    # (01M496JTHN19BZ7YN94993R35X). It never deploys the shared riff
    # (01M3NJAZ8HSE87H0GZ8SNGWN31). One stage deploy runs at a time; a
    # newer run waits for it. The job compiles nothing
    # (01M6QQ1PB372MQ7M527HVT323F): it takes the static binaries of the
    # tree of the commit from the run that the plan names.
    name: Stage
    needs: [gate, plan]
    if: >-
      vars.STAGE_DEPLOY == 'true' && github.event_name == 'push' &&
      github.ref == 'refs/heads/main' && needs.gate.result == 'success'
    runs-on: ${{ vars.RIFF_RUNNER || 'ubuntu-latest' }}
    environment: stage
    permissions:
      contents: read
      actions: read
      id-token: write
    concurrency:
      group: stage
      cancel-in-progress: false
    env:
      COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7

      - name: Read the cloud settings
        run: |
          grep -E '^[A-Z_]+=' deploy/cloud/stage.env >> "$GITHUB_ENV"
          . deploy/cloud/stage.env
          echo "IMAGE=$CLOUD_REGION-docker.pkg.dev/$CLOUD_PROJECT/$CLOUD_REPOSITORY/riff-server:$COMMIT" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v8
        with:
          name: static-${{ needs.plan.outputs.static_profile }}-${{ needs.plan.outputs.tree }}
          run-id: ${{ needs.plan.outputs.static_run }}
          github-token: ${{ github.token }}
          path: static

      # An artifact has no file mode.
      - name: Make the files run
        run: chmod +x static/riff static/riff-server

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/${{ env.CLOUD_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github/providers/github
          service_account: ${{ env.CLOUD_DEPLOY_ACCOUNT }}@${{ env.CLOUD_PROJECT }}.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v3

      - name: Let Docker push to the image repository
        run: gcloud auth configure-docker "$CLOUD_REGION-docker.pkg.dev" --quiet

      - name: Build and push the image of the commit
        run: deploy/cloud/image.sh "$IMAGE" static/riff-server

      - name: Deploy
        env:
          RIFF_OWNER: ${{ vars.RIFF_OWNER }}
        run: static/riff cloud deploy stage "$COMMIT"

      - name: Smoke test
        env:
          RIFF_SMOKE_TOKEN: ${{ secrets.RIFF_SMOKE_TOKEN }}
          RIFF_HOME: ${{ runner.temp }}/riff-home
        run: static/riff cloud smoke stage

  audit:
    # A separate job, so a new advisory cannot hide a code failure (and the
    # reverse). The weekly schedule runs only this job. It is no required
    # check, so the merge queue skips it.
    name: Crate audit
    if: github.event_name != 'merge_group'
    runs-on: ${{ vars.RIFF_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7

      - run: rustup show

      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-audit

      - name: Audit
        run: just crate-audit
