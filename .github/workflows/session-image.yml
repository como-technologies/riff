name: Session image

# The images of this repository (01M5SNTDW9WVEXZW5D0TKGBA8Z): riff-base
# from deploy/base/, riff-rust from deploy/rust/, FROM riff-base, and the
# session image from deploy/session/, FROM riff-rust. A change of a
# folder, of a pin or of this workflow builds the image of each folder,
# when the registry does not have it yet. Each job checks that the FROM
# of its Dockerfile pins the image before it, and the last job checks
# that riff.toml pins the session image (01M5SNTDZ95BRDCPQEKDTYD2PY,
# 01M4Z7SP9YZ5JCHA8YD8R5A4Y9).
on:
  push:
    branches: [main]
    paths:
      - deploy/base/**
      - deploy/rust/**
      - deploy/session/**
      - deploy/contract.sh
      - riff.toml
      - rust-toolchain.toml
      - .github/actions/image/**
      - .github/workflows/session-image.yml
  pull_request:
    branches: [main]
    paths:
      - deploy/base/**
      - deploy/rust/**
      - deploy/session/**
      - deploy/contract.sh
      - riff.toml
      - rust-toolchain.toml
      - .github/actions/image/**
      - .github/workflows/session-image.yml

# Least privilege: each job below adds the write of the packages.
permissions:
  contents: read

# One run at a time. A newer run waits, and then finds the images.
concurrency:
  group: session-image
  cancel-in-progress: false

env:
  BASE: ghcr.io/como-technologies/riff-base
  RUST: ghcr.io/como-technologies/riff-rust
  IMAGE: ghcr.io/como-technologies/riff-session

jobs:
  base:
    name: Base image
    # A pull request from a fork cannot write the packages, so it cannot
    # push the images.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      - name: Build the image of deploy/base
        id: image
        uses: ./.github/actions/image
        with:
          image: ${{ env.BASE }}
          folder: deploy/base
          contract: base
          actor: ${{ github.actor }}
          token: ${{ secrets.GITHUB_TOKEN }}

  rust:
    name: Rust image
    needs: [base]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      - name: Check the FROM of deploy/rust
        env:
          WANT: ${{ env.BASE }}@${{ needs.base.outputs.digest }}
        run: |
          have=$(sed -n 's/^FROM //p' deploy/rust/Dockerfile | head -n 1)
          if [ "$have" != "$WANT" ]; then
            echo "::error file=deploy/rust/Dockerfile::deploy/rust/Dockerfile builds FROM $have. The image of deploy/base/ is $WANT. Pin it: FROM $WANT"
            exit 1
          fi
          echo "deploy/rust/Dockerfile builds FROM $WANT."

      - name: Build the image of deploy/rust
        id: image
        uses: ./.github/actions/image
        with:
          image: ${{ env.RUST }}
          folder: deploy/rust
          contract: rust
          actor: ${{ github.actor }}
          token: ${{ secrets.GITHUB_TOKEN }}

  session:
    name: Session image
    needs: [rust]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Check the FROM of deploy/session
        env:
          WANT: ${{ env.RUST }}@${{ needs.rust.outputs.digest }}
        run: |
          have=$(sed -n 's/^FROM //p' deploy/session/Dockerfile | head -n 1)
          if [ "$have" != "$WANT" ]; then
            echo "::error file=deploy/session/Dockerfile::deploy/session/Dockerfile builds FROM $have. The image of deploy/rust/ is $WANT. Pin it: FROM $WANT"
            exit 1
          fi
          echo "deploy/session/Dockerfile builds FROM $WANT."

      - name: Build the image of deploy/session
        id: image
        uses: ./.github/actions/image
        with:
          image: ${{ env.IMAGE }}
          folder: deploy/session
          actor: ${{ github.actor }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check the pin in riff.toml
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          want="$IMAGE@$DIGEST"
          {
            echo
            echo "Pin it in \`riff.toml\`:"
            echo
            echo '```toml'
            echo "image = \"$want\""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          pinned=$(python3 -I -c 'import tomllib; print(tomllib.load(open("riff.toml", "rb"))["session"]["image"])')
          if [ "$pinned" != "$want" ]; then
            echo "::error file=riff.toml::riff.toml pins $pinned. The image of deploy/session/ is $want. Pin it: image = \"$want\""
            exit 1
          fi
          echo "riff.toml pins $want."
