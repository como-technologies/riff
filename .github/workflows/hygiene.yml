name: Hygiene

# The form of each pull request, and of each commit on main (see the
# docs of the hygiene crate). A separate workflow, so an edit of a pull
# request does not run the Gate again. On a push to main, it checks the
# new commit with the commit rule (01M3JFEXS6M5549TC6MH0G2MS0).
on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened, milestoned, demilestoned]
  push:
    branches: [main]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  hygiene:
    name: Hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # rust-toolchain.toml pins the toolchain; rustup reads it.
      - run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Check the pull request
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: cargo run -q -p hygiene -- pr "$PR"

      - name: Check the commit on main
        if: github.event_name == 'push'
        run: cargo run -q -p hygiene -- commit "$GITHUB_SHA"
