name: Release images

# The release tag vX.Y.Z names the images that the release pins
# (01M5SNTE54DH3N568GZXRQ86DC): the riff-base in the FROM of
# deploy/rust/Dockerfile, and the riff-rust in the FROM of
# deploy/session/Dockerfile. The workflow "Session image" built them
# before. The job checks that both packages are public, adds the tags
# X.Y.Z and latest to them, and adds their digests to the notes of the
# GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  images:
    name: Release images
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
      OWNER: como-technologies
    steps:
      - uses: actions/checkout@v7

      - name: Read the pins of the release
        run: |
          {
            echo "BASE=$(sed -n 's/^FROM //p' deploy/rust/Dockerfile | head -n 1)"
            echo "RUST=$(sed -n 's/^FROM //p' deploy/session/Dockerfile | head -n 1)"
          } >> "$GITHUB_ENV"

      # An anonymous pull, as podman does it on a machine of a person.
      - name: Check that the packages are public
        run: |
          for ref in "$BASE" "$RUST"; do
            path=${ref#ghcr.io/}
            name=${path%@*}
            digest=${path#*@}
            token=$(curl -fsS "https://ghcr.io/token?service=ghcr.io&scope=repository:$name:pull" | jq -r .token)
            if ! curl -fsSI -H "Authorization: Bearer $token" \
                -H "Accept: application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json, application/vnd.oci.image.index.v1+json" \
                "https://ghcr.io/v2/$name/manifests/$digest" > /dev/null; then
              echo "::error::An anonymous pull of $ref failed. Make the package public: https://github.com/orgs/$OWNER/packages/container/${name#*/}/settings, then Change visibility, then Public. Then run this job again."
              exit 1
            fi
            echo "$ref is public."
          done

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Tag the images with the version and latest
        run: |
          version=${TAG#v}
          for ref in "$BASE" "$RUST"; do
            docker buildx imagetools create \
              --tag "${ref%@*}:$version" --tag "${ref%@*}:latest" "$ref"
          done

      - name: Wait for the release
        run: |
          for _ in $(seq 120); do
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null; then
              exit 0
            fi
            echo "The release $TAG is not there yet. Publish it: gh release create $TAG"
            sleep 30
          done
          echo "::error::The release $TAG is not there after 60 minutes. Publish it, then run this job again."
          exit 1

      - name: Add the digests to the notes of the release
        run: |
          body=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)
          case "$body" in
          *"## Images"*)
            echo "The notes of $TAG name the images already."
            exit 0
            ;;
          esac
          {
            printf '%s\n\n' "$body"
            printf '## Images\n\n'
            printf -- '- `%s`\n' "$BASE" "$RUST"
          } > notes.md
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
