# The generated notes of a GitHub release: the changelog of riff
# (01M3NB3EWE2V9PCTMNTZAKEXMA). They list each pull request merged
# since the last release. The changes for people come first, then the
# design pages, then the internal changes (01M40AB1D5KQ4SERC6M709Z3JF).
changelog:
  categories:
    - title: Changes
      labels:
        - "*"
      exclude:
        labels:
          - design
          - internal
    - title: Design
      labels:
        - design
    - title: Internal
      labels:
        - internal
